name: Schema Migration Governance

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  schema-governance:
    name: Schema immutability and numbering
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout pull request source and history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Reject edits, renames, deletions and numbering errors
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "${BASE_SHA}^{commit}"

          python3 - <<'PY'
          import os
          import re
          import subprocess
          import sys
          from collections import Counter

          base = os.environ["BASE_SHA"]
          schema_dir = "backend/schema/"
          filename_pattern = re.compile(
              r"^backend/schema/([0-9]{3})_[a-z0-9_]+\.sql$"
          )

          def git(*args):
              return subprocess.run(
                  ["git", *args],
                  check=True,
                  text=True,
                  capture_output=True,
              ).stdout

          errors = []
          base_files = [
              path for path in git(
                  "ls-tree", "-r", "--name-only", base, "--", schema_dir
              ).splitlines()
              if path.endswith(".sql")
          ]

          base_numbers = []
          for path in base_files:
              match = filename_pattern.fullmatch(path)
              if not match:
                  errors.append(f"Invalid existing migration filename: {path}")
              else:
                  base_numbers.append(int(match.group(1)))

          changes = git(
              "diff", "--name-status", "--no-renames",
              f"{base}...HEAD", "--", schema_dir
          )
          added_sql = []

          for line in changes.splitlines():
              if not line:
                  continue
              status, path = line.split("\t", 1)
              if status != "A":
                  errors.append(
                      f"Existing schema file changed or removed: {path} "
                      f"(status {status}). Migration filenames and contents "
                      "are immutable; add a new migration instead."
                  )
                  continue
              if not path.endswith(".sql"):
                  errors.append(
                      f"Only numbered SQL migrations may be added under "
                      f"{schema_dir}: {path}"
                  )
              else:
                  added_sql.append(path)

          for number, count in sorted(Counter(base_numbers).items()):
              if count > 1:
                  errors.append(
                      f"Base branch already has duplicate migration number "
                      f"{number:03d}."
                  )

          new_numbers = []
          for path in added_sql:
              match = filename_pattern.fullmatch(path)
              if not match:
                  errors.append(
                      f"Invalid new migration filename: {path}. Expected "
                      "NNN_lowercase_description.sql."
                  )
              else:
                  new_numbers.append(int(match.group(1)))

          new_counts = Counter(new_numbers)
          for number, count in sorted(new_counts.items()):
              if count > 1:
                  errors.append(
                      f"New migration number {number:03d} is used {count} times."
                  )

          if new_numbers:
              highest = max(base_numbers, default=-1)
              expected = list(
                  range(highest + 1, highest + 1 + len(new_numbers))
              )
              actual = sorted(new_numbers)
              if actual != expected:
                  errors.append(
                      "New migration numbers must be consecutive and start "
                      f"after the current maximum. Expected {expected}; "
                      f"found {actual}. Next permitted number: "
                      f"{highest + 1:03d}."
                  )

          if errors:
              print("SCHEMA GOVERNANCE FAILED:")
              for error in errors:
                  print(f" - {error}")
              sys.exit(1)

          print("SCHEMA GOVERNANCE PASSED.")
          print("No existing schema migration was modified, renamed or deleted.")
          if new_numbers:
              print(
                  "Validated new migration numbers:",
                  ", ".join(f"{n:03d}" for n in sorted(new_numbers)),
              )
          else:
              print("No new SQL migrations in this pull request.")
          print("Historical numbering gaps are not retroactively rejected.")
          PY
