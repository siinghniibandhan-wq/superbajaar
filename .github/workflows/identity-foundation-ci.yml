name: Identity Foundation CI

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/identity-foundation-ci.yml"
      - ".github/workflows/hrms-staging-migrations.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: identity-foundation-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend identity tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: superbajaar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d superbajaar_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Run backend tests
        working-directory: backend
        env:
          PYTHONPATH: .
          IDENTITY_OTP_HMAC_SECRET: "ci-test-secret-with-at-least-32-characters"
          TEST_DATABASE_URL: "postgresql://postgres:ci-test-password@localhost:5432/superbajaar_test"
        run: python -m pytest -q tests --ignore=tests/smoke_test.py

  admin-frontend-checks:
    name: Admin frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Run unit and contract tests
        run: npm run test:unit
      - name: Check admin routes
        run: npm run test:routes
      - name: Build admin frontend
        run: npm run build
      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium
      - name: Run responsive browser tests
        run: npm run test:e2e
