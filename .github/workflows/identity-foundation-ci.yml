name: Identity Foundation CI

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/identity-foundation-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: identity-foundation-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend identity tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Run backend tests
        working-directory: backend
        env:
          PYTHONPATH: .
          IDENTITY_OTP_HMAC_SECRET: "ci-test-secret-with-at-least-32-characters"
        run: python -m pytest -q tests/test_identity_otp.py tests/test_identity_documents.py tests/test_customer_identity_verification_api.py tests/test_unified_identity_schema.py

  admin-frontend-checks:
    name: Admin frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Run unit and contract tests
        run: npm run test:unit
      - name: Check admin routes
        run: npm run test:routes
      - name: Build admin frontend
        run: npm run build
