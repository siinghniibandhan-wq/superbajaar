name: Super Bajaar CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  agent-issue-template:
    name: Validate AI agent issue form and governance workflow
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Validate issue form and governance workflow
        run: python .github/scripts/validate_agent_issue_template.py


  backend-tests:
    name: Backend tests (Python 3.12)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Compile backend source
        run: python -m compileall -q backend/app

      - name: Run backend unit tests
        working-directory: backend
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m pytest tests/test_*.py -q --strict-markers --strict-config

  frontend-builds:
    name: Frontend build (${{ matrix.directory }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        directory: ['.', 'frontend']
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify package manifest
        working-directory: ${{ matrix.directory }}
        run: |
          test -f package.json
          node --version
          npm --version

      - name: Install dependencies
        working-directory: ${{ matrix.directory }}
        run: npm install --no-audit --no-fund

      - name: Build production bundle
        working-directory: ${{ matrix.directory }}
        run: npm run build
