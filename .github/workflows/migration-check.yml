name: Database files check

# Blocks a pull request if any database file or the migration runner is broken.
# Runs on throw-away Postgres 15 and 16 (production is on 15). Nothing here touches the real database.
# Owner: turn on "Require status checks" for this job in GitHub branch protection for main.
# These two matrix jobs are required by the main-branch ruleset.
# Run on every PR so required checks are never silently skipped by path filters.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  database-files:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        pg: ["15", "16"]
    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: scratch
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: test
      PGDATABASE: scratch
    steps:
      - uses: actions/checkout@v4

      - name: Install Postgres 16 client tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-16

      - name: File names and protected legacy pairs
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(backend/schema/*.sql)
          (("${#files[@]}" > 0)) || { echo "ERROR: no schema files found"; exit 1; }

          declare -A counts=()
          for path in "${files[@]}"; do
            name=${path##*/}
            [[ "$name" =~ ^[0-9]{3}_[a-z0-9_]+\.sql$ ]] || { echo "ERROR: bad schema filename: $name"; exit 1; }
            prefix=${name:0:3}
            counts[$prefix]=$(( ${counts[$prefix]:-0} + 1 ))
          done

          for prefix in "${!counts[@]}"; do
            count=${counts[$prefix]}
            [[ "$count" -eq 1 ]] || { echo "ERROR: number $prefix is used by $count files"; exit 1; }
          done
          echo "Schema filenames and both protected legacy pairs are valid."

      - name: Reject duplicate CREATE TABLE declarations
        run: python3 backend/scripts/check_schema_integrity.py backend/schema

      - name: Confirm PostgreSQL server version
        run: |
          actual=$(psql -X -At -v ON_ERROR_STOP=1 -c "SHOW server_version_num")
          case "${{ matrix.pg }}:$actual" in
            15:15*|16:16*) echo "PostgreSQL server version confirmed: $actual" ;;
            *) echo "ERROR: expected PostgreSQL ${{ matrix.pg }}, got server_version_num=$actual"; exit 1 ;;
          esac

      - name: Create application role for permission verification
        run: |
          psql -v ON_ERROR_STOP=1 -q -c "CREATE ROLE superbajaar_user NOLOGIN"

      - name: Every schema file applies, in order (first run)
        run: |
          for f in $(ls backend/schema/*.sql | sort); do
            echo "== applying $f"; psql -v ON_ERROR_STOP=1 -q -f "$f"
          done

      - name: Every schema file applies again (must be safe to repeat)
        run: |
          for f in $(ls backend/schema/*.sql | sort); do
            echo "== re-applying $f"; psql -v ON_ERROR_STOP=1 -q -f "$f"
          done

      - name: Verify Super Coins table and sequence privileges
        run: |
          psql -v ON_ERROR_STOP=1 -X <<'SQL'
          DO $verify$
          DECLARE
              v_sequence text;
              v_table text;
          BEGIN
              IF NOT has_table_privilege('superbajaar_user', 'public.loyalty_expiration_allocations', 'SELECT,INSERT')
                 OR has_table_privilege('superbajaar_user', 'public.loyalty_expiration_allocations', 'UPDATE,DELETE') THEN
                  RAISE EXCEPTION 'Unexpected loyalty_expiration_allocations table privileges';
              END IF;

              IF NOT has_table_privilege('superbajaar_user', 'public.loyalty_order_redemptions', 'SELECT,INSERT,UPDATE')
                 OR has_table_privilege('superbajaar_user', 'public.loyalty_order_redemptions', 'DELETE') THEN
                  RAISE EXCEPTION 'Unexpected loyalty_order_redemptions table privileges';
              END IF;

              IF NOT has_table_privilege('superbajaar_user', 'public.loyalty_redemption_restorations', 'INSERT')
                 OR has_table_privilege('superbajaar_user', 'public.loyalty_redemption_restorations', 'SELECT,UPDATE,DELETE') THEN
                  RAISE EXCEPTION 'Unexpected loyalty_redemption_restorations table privileges';
              END IF;

              FOREACH v_table IN ARRAY ARRAY[
                  'loyalty_expiration_allocations',
                  'loyalty_order_redemptions',
                  'loyalty_redemption_restorations'
              ]
              LOOP
                  v_sequence := pg_get_serial_sequence(format('public.%I', v_table), 'id');
                  IF v_sequence IS NULL
                     OR NOT has_sequence_privilege('superbajaar_user', v_sequence, 'USAGE,SELECT')
                     OR has_sequence_privilege('superbajaar_user', v_sequence, 'UPDATE') THEN
                      RAISE EXCEPTION 'Unexpected id sequence privileges for public.%', v_table;
                  END IF;
              END LOOP;
          END
          $verify$;
          SELECT 'Super Coins table and sequence privileges verified for superbajaar_user';
          SQL

      - name: Phone rule (same number in different formats must be blocked)
        run: |
          ins() { psql -v ON_ERROR_STOP=1 -q -c "INSERT INTO customer_accounts (email,full_name,phone,password_hash,referral_code) VALUES ('$1','N','$2','x','$3');"; }
          ins a@test.com 9876543210 REFCODE1
          for p in "+91 98765 43210" "098765 43210" "98765-43210"; do
            if ins "x$RANDOM@test.com" "$p" "RC$RANDOM$RANDOM" 2>/dev/null; then echo "ERROR: duplicate '$p' was accepted"; exit 1; fi
          done
          ins c@test.com 9123456789 REFCODE9
          echo "phone rule works"

      - name: Reject duplicate table names in the resulting database
        run: |
          duplicates=$(psql -X -At -v ON_ERROR_STOP=1 -c "SELECT string_agg(table_name, ', ' ORDER BY table_name) FROM (SELECT c.relname AS table_name FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE c.relkind IN ('r','p') AND n.nspname NOT IN ('pg_catalog','information_schema') AND left(n.nspname,3)<>'pg_' GROUP BY c.relname HAVING count(*) > 1) d")
          [ -z "$duplicates" ] || { echo "ERROR: duplicate table names across schemas: $duplicates"; exit 1; }
          echo "No duplicate table names across non-system schemas."

      - name: Required list only names real files
        run: |
          grep -vE '^\s*(#|$)' backend/schema_required.txt | while read -r f; do
            [ -f "backend/schema/$f" ] || { echo "ERROR: schema_required.txt lists missing file $f"; exit 1; }
          done

      - name: Migration runner tests (backup, rollback, failures, alerts, exit codes)
        env:
          SB_PSQL: psql -h localhost -U postgres
          SB_PGDUMP: pg_dump -h localhost -U postgres
        run: bash backend/scripts/tests/test_apply_schema.sh backend/schema backend/schema_required.txt

      - name: Set up Python for PostgreSQL integration tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies for integration tests
        run: python -m pip install -r backend/requirements.txt

      - name: Run backend end-to-end tests against disposable PostgreSQL
        working-directory: backend
        env:
          SB_TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/scratch
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m pytest tests/test_*.py -q --strict-markers --strict-config
