name: PR governance monitor

# Daily PR portfolio review plus immediate recalculation when a PR changes.
# Reports the documented 15-open-PR cap and 5/7/10-day ageing milestones.
# Never merges or closes pull requests automatically.
on:
  schedule:
    - cron: "30 3 * * *" # 09:00 Asia/Kolkata
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review, closed]

permissions:
  contents: read
  pull-requests: read
  issues: write

concurrency:
  group: pr-governance-monitor
  cancel-in-progress: false

jobs:
  monitor:
    name: Open PR count and ageing
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Audit open pull requests and publish governance report
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pulls = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: "open", per_page: 100, sort: "created", direction: "asc"
            });
            const now = new Date();
            const ageDays = (createdAt) => Math.floor((now - new Date(createdAt)) / 86400000);
            const rows = pulls.map(pr => ({
              number: pr.number,
              title: pr.title,
              url: pr.html_url,
              age: ageDays(pr.created_at),
              draft: pr.draft,
              owner: pr.user?.login || "unknown"
            }));

            const overFive = rows.filter(pr => pr.age >= 5);
            const overSeven = rows.filter(pr => pr.age >= 7);
            const overTen = rows.filter(pr => pr.age >= 10);
            const overLimit = rows.length > 15;

            const table = rows.length
              ? rows.map(pr => `| [#${pr.number}](${pr.url}) | ${pr.title.replaceAll("|", "\\|")} | @${pr.owner} | ${pr.age} | ${pr.draft ? "Draft" : "Ready"} |`).join("\n")
              : "| — | No open pull requests | — | — | — |";

            const summary = [
              "## Pull request governance report",
              "",
              `**Open PRs:** ${rows.length}/15 ${overLimit ? "— LIMIT EXCEEDED" : "— within limit"}`,
              `**5-day target:** ${overFive.length} PR(s) at or beyond 5 days`,
              `**7-day escalation:** ${overSeven.length} PR(s) at or beyond 7 days`,
              `**10-day closure target:** ${overTen.length} PR(s) at or beyond 10 days`,
              "",
              "| PR | Title | Author | Age (days) | State |",
              "|---|---|---|---:|---|",
              table,
              "",
              "### Operating rules",
              "- Day 5: target resolution; owner should update the PR or record the blocker and next review date.",
              "- Day 7: escalation required; identify the blocker and accountable owner.",
              "- Day 10: target closure by merge or reasoned closure; do not close valid work merely to satisfy the metric.",
              "- More than 15 open PRs: portfolio limit breached; pause avoidable new PRs and resolve the queue.",
              "- This workflow reports and escalates; it never auto-merges or auto-closes PRs.",
              "",
              `_Checked at ${now.toISOString()}._`
            ].join("\n");
            await core.summary.addRaw(summary).write();

            // Keep one actionable tracking issue rather than opening a new issue every day.
            // A day-5 target alone is reported in the run summary; escalation starts at day 7.
            const needsEscalation = overLimit || overSeven.length > 0;
            if (needsEscalation) {
              const details = [
                "# PR governance escalation",
                "",
                `Open PR count: **${rows.length}/15**.`,
                "",
                overLimit ? "**Critical: the 15-open-PR limit is exceeded.**" : "Open PR count is within the limit.",
                "",
                "## PRs requiring attention",
                "",
                "| PR | Age | Required action |",
                "|---|---:|---|",
                ...rows.filter(pr => pr.age >= 7).map(pr => `| [#${pr.number} — ${pr.title.replaceAll("|", "\\|")}](${pr.url}) | ${pr.age} days | ${pr.age >= 10 ? "Day-10 closure target: merge or document a reasoned closure" : "Day-7 escalation: name blocker, owner and next review date"} |`),
                "",
                "## Required handling",
                "- Assign an accountable owner and record acceptance criteria / blocker.",
                "- Preserve valid work; do not auto-close or auto-merge.",
                "- For blocked PRs, record the blocker and next review date.",
                "- Review this issue at the next daily monitor run.",
                "",
                `_Last refreshed: ${now.toISOString()}._`
              ].join("\n");
              const marker = "<!-- pr-governance-monitor -->";
              const body = marker + "\n" + details;
              const found = await github.rest.search.issuesAndPullRequests({
                q: `repo:${owner}/${repo} is:issue is:open in:title "PR governance escalation"`,
                per_page: 10
              });
              const existing = found.data.items.find(item => item.body?.includes(marker));
              if (existing) {
                await github.rest.issues.update({ owner, repo, issue_number: existing.number, body });
                core.info(`Updated governance escalation issue #${existing.number}`);
              } else {
                const created = await github.rest.issues.create({
                  owner, repo,
                  title: "PR governance escalation: open-count / ageing thresholds",
                  body
                });
                core.warning(`Created governance escalation issue #${created.data.number}`);
              }
            } else {
              core.info("No day-7 ageing or open-PR count breach. Day-5 targets remain visible in this run summary.");
            }

            if (overLimit) {
              core.setFailed(`Open PR limit exceeded: ${rows.length} open PRs; maximum is 15.`);
            }
