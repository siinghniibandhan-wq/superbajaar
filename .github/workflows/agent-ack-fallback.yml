name: Optional Agent 60-Second Acknowledgement Fallback

on:
  issues:
    types: [labeled]

permissions:
  issues: write
  contents: read

jobs:
  acknowledgement-window:
    if: github.event.label.name == 'agent-dispatched'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Reset prior acknowledgement and start timer
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const issue = await github.rest.issues.get({ owner, repo, issue_number });
            const acknowledged = issue.data.labels.some(x => (typeof x === 'string' ? x : x.name) === 'agent-acknowledged');
            if (acknowledged) {
              await github.rest.issues.removeLabel({ owner, repo, issue_number, name: 'agent-acknowledged' });
            }
            core.info('Previous acknowledgement cleared for this dispatch. Starting 60-second window.');
      - name: Wait 60 seconds
        run: sleep 60

      - name: Check acknowledgement and activate fallback status
        uses: actions/github-script@v7
        with:
          script: |
            const issue_number = context.issue.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue = await github.rest.issues.get({ owner, repo, issue_number });
            const labels = issue.data.labels.map(x => typeof x === 'string' ? x : x.name);
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100
            });
            const dispatchedAt = new Date(context.payload.issue.updated_at);
            const acknowledged = labels.includes('agent-acknowledged') ||
              comments.some(c =>
                new Date(c.created_at) >= dispatchedAt &&
                /^ACK(?:NOWLEDGED)?:\s*/i.test(c.body.trim())
              );

            async function ensureLabel(name, color, description) {
              try {
                await github.rest.issues.getLabel({ owner, repo, name });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({ owner, repo, name, color, description });
              }
            }

            if (acknowledged) {
              core.info('Contributor acknowledged within the 60-second window; no fallback activated.');
              return;
            }

            await ensureLabel('fallback-required', 'd93f0b', 'Preferred optional contributor did not acknowledge within 60 seconds; fallback owner must take over.');
            await github.rest.issues.addLabels({
              owner, repo, issue_number, labels: ['fallback-required']
            });
            await github.rest.issues.createComment({
              owner, repo, issue_number,
              body: [
                '⏱️ **60-second acknowledgement timeout reached.**',
                '',
                'The preferred contributor is optional and did not acknowledge this assignment in time.',
                'Status: **FALLBACK REQUIRED**.',
                '',
                'The fallback owner must take over this same issue and scope after checking for any existing work. Do not start duplicate parallel implementation.',
                '',
                '**Automation:** this workflow marks the fallback. The separate Gemini dispatch workflow listens for `fallback-required` and launches Gemini when the repository secret `GEMINI_API_KEY` is configured. This does not launch a ChatGPT session. No schema approval, production access, merge or deployment is granted by the timeout.'
              ].join('\n')
            });
