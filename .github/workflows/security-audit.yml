name: Security Audit

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: security-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python-security:
    name: Python dependency and SAST checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies and scanners
        run: |
          python -m pip install -r backend/requirements.txt
          python -m pip install pip-audit bandit
      - name: Audit Python dependencies
        run: pip-audit -r backend/requirements.txt
      - name: Record medium-severity findings for review
        run: bandit -r backend/app -ll -x backend/app/tests -f json -o bandit-medium-findings.json || true
      - name: Fail on high-severity static-analysis findings
        run: bandit -r backend/app -lll -x backend/app/tests
      - name: Upload medium-severity findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-medium-findings
          path: bandit-medium-findings.json
          if-no-files-found: ignore

  frontend-security:
    name: Frontend dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=high

  secret-scan:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
