name: Frontend build

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - fix/amplify-storefront-default

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build Amplify frontend
        run: npm run build
