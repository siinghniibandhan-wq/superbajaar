name: Deploy Super Bajaar backend

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-backend-deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    name: Verify source before deployment
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: superbajaar_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d superbajaar_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SB_TEST_DATABASE_URL: postgresql://postgres:test@127.0.0.1:5432/superbajaar_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Apply schema to disposable CI database only
        env:
          PGHOST: 127.0.0.1
          PGUSER: postgres
          PGPASSWORD: test
          PGDATABASE: superbajaar_test
        run: |
          set -euo pipefail
          for f in $(ls backend/schema/*.sql | sort); do
            psql -v ON_ERROR_STOP=1 -q -f "$f"
          done
      - name: Compile and test backend
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m compileall -q backend/app
          cd backend
          python -m pytest tests/test_*.py -q --strict-markers --strict-config
      - name: Test admin frontend
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npm run test:unit
          npm run test:routes
      - name: Build storefront and admin
        run: |
          npm install --no-audit --no-fund
          npm run build
          cd frontend
          npm run build
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Semgrep security scan
        uses: semgrep/semgrep-action@v1
        with:
          config: p/default

  deploy-backend:
    name: Deploy backend to EC2 through SSM
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - name: Configure AWS credentials using GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION || secrets.AWS_REGION }}
      - name: Dispatch deployment to EC2
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID || secrets.EC2_INSTANCE_ID }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$INSTANCE_ID"
          remote_command="sudo -u ubuntu bash -lc 'set -euo pipefail; cd /opt/superbajaar/source; git fetch --quiet origin main; git show ${TARGET_SHA}:backend/scripts/deploy_backend.sh > /tmp/sb-deploy-${TARGET_SHA}.sh; chmod 700 /tmp/sb-deploy-${TARGET_SHA}.sh; bash /tmp/sb-deploy-${TARGET_SHA}.sh ${TARGET_SHA}; rm -f /tmp/sb-deploy-${TARGET_SHA}.sh'"
          parameters="$(jq -n --arg command "$remote_command" '{commands: [$command]}')"
          command_id="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Super Bajaar backend deploy $TARGET_SHA" \
            --parameters "$parameters" \
            --query 'Command.CommandId' --output text)"
          for attempt in $(seq 1 60); do
            status="$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || true)"
            case "$status" in
              Success) exit 0 ;;
              Failed|Cancelled|TimedOut) aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID"; exit 1 ;;
            esac
            sleep 10
          done
          echo "Timed out waiting for EC2 deployment command $command_id"
          exit 1

  verify-amplify:
    name: Verify and automatically restore Amplify frontend
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: production
    steps:
      - name: Configure AWS credentials using GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION || secrets.AWS_REGION }}
      - name: Wait for this commit and capture previous successful release
        id: amplify
        env:
          APP_ID: ${{ vars.AMPLIFY_APP_ID }}
          BRANCH_NAME: main
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$APP_ID" || { echo "AMPLIFY_APP_ID repository variable is required"; exit 1; }
          jobs="$(aws amplify list-jobs --app-id "$APP_ID" --branch-name "$BRANCH_NAME" --max-results 50)"
          previous="$(jq -c --arg sha "$TARGET_SHA" '[.jobSummaries[] | select(.status == "SUCCEED" and .commitId != $sha)] | sort_by(.startTime) | reverse | .[0] // empty' <<<"$jobs")"
          test -n "$previous" || { echo "No previous successful Amplify release found; refusing an ungrounded rollback"; exit 1; }
          previous_id="$(jq -r '.jobId' <<<"$previous")"
          previous_sha="$(jq -r '.commitId' <<<"$previous")"
          echo "previous_job_id=$previous_id" >> "$GITHUB_OUTPUT"
          echo "previous_sha=$previous_sha" >> "$GITHUB_OUTPUT"
          echo "Previous known-good Amplify release: $previous_sha (job $previous_id)"
          current_id=""
          for attempt in $(seq 1 60); do
            jobs="$(aws amplify list-jobs --app-id "$APP_ID" --branch-name "$BRANCH_NAME" --max-results 50)"
            current="$(jq -c --arg sha "$TARGET_SHA" '[.jobSummaries[] | select(.commitId == $sha)] | sort_by(.startTime) | reverse | .[0] // empty' <<<"$jobs")"
            if [[ -n "$current" ]]; then
              current_id="$(jq -r '.jobId' <<<"$current")"
              status="$(jq -r '.status' <<<"$current")"
              echo "Amplify job $current_id status: $status"
              case "$status" in
                SUCCEED|FAILED|CANCELLED) break ;;
              esac
            fi
            sleep 20
          done
          test -n "$current_id" || { echo "Timed out waiting for Amplify job for $TARGET_SHA"; exit 1; }
          echo "current_job_id=$current_id" >> "$GITHUB_OUTPUT"
          echo "current_status=$status" >> "$GITHUB_OUTPUT"
      - name: Verify published release and all referenced frontend assets
        id: health
        env:
          SITE_URL: ${{ vars.AMPLIFY_SITE_URL || secrets.AMPLIFY_SITE_URL }}
          EXPECTED_SHA: ${{ steps.amplify.outputs.current_status == 'SUCCEED' && github.sha || steps.amplify.outputs.previous_sha }}
        run: |
          set -euo pipefail
          test -n "$SITE_URL" || { echo "AMPLIFY_SITE_URL is not configured"; exit 1; }
          verify_release() {
            local expected="$1"
            local html="/tmp/amplify-index.html"
            curl --fail --silent --show-error --location --retry 3 --retry-all-errors --max-time 30 -H 'Cache-Control: no-cache' "$SITE_URL/?sb_health=$GITHUB_RUN_ID" -o "$html"
            grep -qi '<html' "$html"
            grep -Fq "name=\"sb-release\" content=\"$expected\"" "$html" || {
              echo "Published HTML release marker does not match expected commit $expected"
              return 1
            }
            python - "$html" "$SITE_URL" <<'PY'
          import html.parser, sys, urllib.parse, urllib.request
          class Assets(html.parser.HTMLParser):
              def __init__(self):
                  super().__init__(); self.urls=[]
              def handle_starttag(self, tag, attrs):
                  attrs=dict(attrs)
                  for key in ("src", "href"):
                      value=attrs.get(key, "")
                      if value and (".js" in value or ".css" in value):
                          self.urls.append(value)
          parser=Assets()
          parser.feed(open(sys.argv[1], encoding="utf-8").read())
          base=sys.argv[2]
          assets=list(dict.fromkeys(urllib.parse.urljoin(base, x) for x in parser.urls))
          if not any(".js" in x for x in assets):
              raise SystemExit("No JavaScript bundle was found in the published HTML")
          for url in assets:
              request=urllib.request.Request(url, headers={"Cache-Control":"no-cache"})
              with urllib.request.urlopen(request, timeout=25) as response:
                  if response.status != 200:
                      raise SystemExit(f"Asset check failed: {url} returned {response.status}")
                  if response.headers.get("Content-Length") == "0":
                      raise SystemExit(f"Asset is empty: {url}")
          print(f"Verified {len(assets)} published JS/CSS assets")
          PY
          }
          if [[ "$EXPECTED_SHA" == "$GITHUB_SHA" ]]; then
            verify_release "$EXPECTED_SHA"
          else
            verify_release "$EXPECTED_SHA"
          fi
      - name: Restore previous successful Amplify release if deployment or health check failed
        if: steps.amplify.outputs.current_status != 'SUCCEED' || steps.health.outcome != 'success'
        env:
          APP_ID: ${{ vars.AMPLIFY_APP_ID }}
          BRANCH_NAME: main
          PREVIOUS_JOB_ID: ${{ steps.amplify.outputs.previous_job_id }}
          PREVIOUS_SHA: ${{ steps.amplify.outputs.previous_sha }}
        run: |
          set -euo pipefail
          echo "Restoring previous successful Amplify job $PREVIOUS_JOB_ID ($PREVIOUS_SHA)"
          rollback="$(aws amplify start-job --app-id "$APP_ID" --branch-name "$BRANCH_NAME" --job-type RETRY --job-id "$PREVIOUS_JOB_ID")"
          rollback_id="$(jq -r '.jobSummary.jobId' <<<"$rollback")"
          test -n "$rollback_id" && test "$rollback_id" != "null"
          for attempt in $(seq 1 60); do
            status="$(aws amplify get-job --app-id "$APP_ID" --branch-name "$BRANCH_NAME" --job-id "$rollback_id" --query 'job.summary.status' --output text)"
            echo "Amplify rollback job $rollback_id status: $status"
            case "$status" in
              SUCCEED) break ;;
              FAILED|CANCELLED) echo "Amplify rollback job failed: $status"; exit 1 ;;
            esac
            sleep 20
          done
          test "$status" = "SUCCEED" || { echo "Timed out waiting for Amplify rollback"; exit 1; }
          echo "rollback_job_id=$rollback_id" >> "$GITHUB_OUTPUT"
      - name: Verify restored Amplify version is fully healthy
        if: steps.amplify.outputs.current_status != 'SUCCEED' || steps.health.outcome != 'success'
        env:
          SITE_URL: ${{ vars.AMPLIFY_SITE_URL || secrets.AMPLIFY_SITE_URL }}
          EXPECTED_SHA: ${{ steps.amplify.outputs.previous_sha }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 5 --max-time 30 -H 'Cache-Control: no-cache' "$SITE_URL/?sb_health=$GITHUB_RUN_ID-rollback" -o /tmp/amplify-restored.html
          grep -qi '<html' /tmp/amplify-restored.html
          grep -Fq "name=\"sb-release\" content=\"$EXPECTED_SHA\"" /tmp/amplify-restored.html
          python - /tmp/amplify-restored.html "$SITE_URL" <<'PY'
          import html.parser, sys, urllib.parse, urllib.request
          class Assets(html.parser.HTMLParser):
              def __init__(self): super().__init__(); self.urls=[]
              def handle_starttag(self, tag, attrs):
                  attrs=dict(attrs)
                  for key in ("src","href"):
                      value=attrs.get(key,"")
                      if value and (".js" in value or ".css" in value): self.urls.append(value)
          parser=Assets(); parser.feed(open(sys.argv[1],encoding="utf-8").read())
          assets=list(dict.fromkeys(urllib.parse.urljoin(sys.argv[2],x) for x in parser.urls))
          if not any(".js" in x for x in assets): raise SystemExit("Restored page has no JS bundle")
          for url in assets:
              with urllib.request.urlopen(urllib.request.Request(url,headers={"Cache-Control":"no-cache"}),timeout=25) as r:
                  if r.status != 200: raise SystemExit(f"Restored asset failed: {url} ({r.status})")
          print(f"Restored release {sys.argv[1]}: {len(assets)} JS/CSS assets healthy")
          PY
