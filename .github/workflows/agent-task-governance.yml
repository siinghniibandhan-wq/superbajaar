name: Agent task governance

on:
  issues:
    types: [opened, edited, reopened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Optional issue number to validate"
        required: false
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: agent-task-${{ github.event.issue.number || inputs.issue_number || github.run_id }}
  cancel-in-progress: false

jobs:
  validate-agent-task:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.issue_number != '') ||
      (github.event_name == 'issues' && startsWith(github.event.issue.title, '[AGENT TASK]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Validate task fields and maintain readiness label
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = context.eventName === 'workflow_dispatch'
              ? Number(context.payload.inputs?.issue_number || '')
              : context.issue.number;
            if (!Number.isInteger(issueNumber) || issueNumber < 1) {
              core.setFailed('A valid issue_number is required for manual dispatch.');
              return;
            }

            const { data: issue } = await github.rest.issues.get({
              ...context.repo,
              issue_number: issueNumber
            });
            if (issue.pull_request || !issue.title.startsWith('[AGENT TASK]')) {
              core.info('Not an agent task issue; skipping.');
              return;
            }

            const statusLabels = [
              { name: 'agent:ready', color: '0E8A16', description: 'Scoped and ready for an agent or human to accept' },
              { name: 'agent:in-progress', color: '1D76DB', description: 'Execution has actually started' },
              { name: 'agent:blocked', color: 'D93F0B', description: 'Waiting on a dependency, decision or permission' },
              { name: 'agent:review', color: 'FBCA04', description: 'Deliverable is awaiting independent review' },
              { name: 'agent:done', color: '5319E7', description: 'Acceptance criteria and required evidence are complete' }
            ];
            const providerLabels = [
              { name: 'jules', color: '6F42C1', description: 'Dispatch to Google Jules only after its GitHub App is connected and repository access is verified' }
            ];
            const { data: repositoryLabels } = await github.rest.issues.listLabelsForRepo({
              ...context.repo,
              per_page: 100
            });
            const existingRepositoryLabels = new Set(repositoryLabels.map(label => label.name));
            for (const label of [...statusLabels, ...providerLabels]) {
              if (existingRepositoryLabels.has(label.name)) continue;
              try {
                await github.rest.issues.createLabel({
                  ...context.repo,
                  name: label.name,
                  color: label.color,
                  description: label.description
                });
              } catch (error) {
                // Parallel issue events may race to create the same shared label.
                if (error.status !== 422) throw error;
              }
            }

            const requiredHeadings = [
              'Task type',
              'Priority',
              'Objective and user impact',
              'Primary agent / accountable owner',
              'Approved fallback',
              'Dependencies',
              'Repository, starting branch and base commit',
              'Allowed paths / write scope',
              'Protected paths / systems',
              'Access mode',
              'Required inputs and evidence',
              'Acceptance criteria',
              'Tests and verification required',
              'Expected deliverable and handoff',
              'Independent reviewer'
            ];
            const body = issue.body || '';
            const sections = new Map();
            const headingPattern = /^### (.+?)\s*$/gm;
            const headings = [...body.matchAll(headingPattern)];
            for (let i = 0; i < headings.length; i++) {
              const start = headings[i].index + headings[i][0].length;
              const end = i + 1 < headings.length ? headings[i + 1].index : body.length;
              sections.set(headings[i][1].trim(), body.slice(start, end).trim());
            }
            const missing = requiredHeadings.filter(name => {
              const value = sections.get(name);
              return !value || value === '_No response_';
            });

            const existing = (issue.labels || []).map(label => typeof label === 'string' ? label : label.name);
            const statusNames = statusLabels.map(label => label.name);
            const currentStatus = statusNames.filter(name => existing.includes(name));

            if (missing.length) {
              const remove = currentStatus.filter(name => name !== 'agent:blocked');
              for (const name of remove) {
                await github.rest.issues.removeLabel({
                  ...context.repo,
                  issue_number: issueNumber,
                  name
                }).catch(error => {
                  if (error.status !== 404) throw error;
                });
              }
              if (!existing.includes('agent:blocked')) {
                await github.rest.issues.addLabels({
                  ...context.repo,
                  issue_number: issueNumber,
                  labels: ['agent:blocked']
                });
                await github.rest.issues.createComment({
                  ...context.repo,
                  issue_number: issueNumber,
                  body: 'This agent task is **BLOCKED** because required task fields are missing or empty: ' +
                    missing.map(name => '`' + name + '`').join(', ') +
                    '. Complete the issue details before dispatch. No agent has been started.'
                });
              }
              core.setFailed('Incomplete agent task. Missing: ' + missing.join(', '));
              return;
            }

            const reopenedCompletedTask =
              context.eventName === 'issues' &&
              context.payload.action === 'reopened' &&
              currentStatus.includes('agent:done');
            if (reopenedCompletedTask) {
              for (const name of currentStatus) {
                await github.rest.issues.removeLabel({
                  ...context.repo,
                  issue_number: issueNumber,
                  name
                });
              }
              await github.rest.issues.addLabels({
                ...context.repo,
                issue_number: issueNumber,
                labels: ['agent:ready']
              });
              core.notice('Reopened completed task reset to READY for reassessment.');
              return;
            }

            if (currentStatus.length === 0 || currentStatus.includes('agent:blocked')) {
              for (const name of currentStatus) {
                await github.rest.issues.removeLabel({
                  ...context.repo,
                  issue_number: issueNumber,
                  name
                });
              }
              await github.rest.issues.addLabels({
                ...context.repo,
                issue_number: issueNumber,
                labels: ['agent:ready']
              });
              core.notice('Task is valid and READY. This does not dispatch or start an agent.');
            } else {
              core.notice('Task fields are valid. Preserving current execution/review state: ' + currentStatus.join(', '));
            }
