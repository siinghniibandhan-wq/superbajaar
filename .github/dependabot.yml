version: 2
updates:
  # Storefront dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      storefront-npm-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # Supervisor Admin frontend dependencies
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      admin-npm-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # FastAPI backend dependencies
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      backend-pip-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions used by CI workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      github-actions-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
